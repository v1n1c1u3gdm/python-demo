openapi: 3.0.1
info:
  title: Python Demo API
  version: v1
servers:
  - url: http://localhost:3000
paths:
  /authors:
    get:
      tags:
        - Authors
      summary: Lista autores
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      tags:
        - Authors
      summary: Cria um autor
      description: Requer Bearer válido com papel admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: Autor criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /authors/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
        - Authors
      summary: Detalha um autor
      responses:
        '200':
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Authors
      summary: Atualiza um autor
      description: Requer Bearer válido com papel admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorPatchInput'
      responses:
        '200':
          description: Autor atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Authors
      summary: Remove um autor
      description: Requer Bearer válido com papel admin.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Autor removido
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /socials:
    get:
      tags:
        - Socials
      summary: Lista perfis sociais
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Social'
    post:
      tags:
        - Socials
      summary: Cria um perfil social
      description: Requer Bearer válido com papel admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialInput'
      responses:
        '201':
          description: Perfil criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /socials/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
        - Socials
      summary: Detalha um perfil social
      responses:
        '200':
          description: Perfil localizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Socials
      summary: Atualiza um perfil social
      description: Requer Bearer válido com papel admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialInput'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Socials
      summary: Remove um perfil social
      description: Requer Bearer válido com papel admin.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Perfil removido
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /articles:
    get:
      tags:
        - Articles
      summary: Lista artigos
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
    post:
      tags:
        - Articles
      summary: Cria um artigo
      description: Requer Bearer válido com papel admin ou autor vinculado. Para author, author_id é atribuído pelo servidor.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '201':
          description: Artigo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /authors/{id}/identity:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags:
        - Authors
      summary: Vincula a identidade Keycloak privada a um autor
      description: Requer Bearer válido com papel admin. Issuer precisa corresponder ao configurado; o vínculo não integra o recurso público Author.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity]
              properties:
                identity:
                  type: object
                  required: [issuer, sub]
                  properties:
                    issuer:
                      type: string
                    sub:
                      type: string
      responses:
        '200':
          description: Identidade vinculada
        '400':
          description: Issuer ou payload inválido
        '401':
          description: Bearer ausente ou inválido
        '403':
          description: Papel admin ausente
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Identidade já vinculada a outro autor
    delete:
      tags:
        - Authors
      summary: Remove o vínculo privado de identidade
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Vínculo removido ou já ausente
        '401':
          description: Bearer ausente ou inválido
        '403':
          description: Papel admin ausente
        '404':
          $ref: '#/components/responses/NotFound'
  /articles/count_by_author:
    get:
      tags:
        - Articles
      summary: Conta artigos agrupados por autor
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticlesCountByAuthor'
  /admin/profile:
    get:
      tags:
        - Authentication
      summary: Retorna perfil administrativo do principal
      description: Requer Bearer válido com papel admin.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil autenticado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /up:
    get:
      tags:
        - Health
      summary: Verifica liveness do processo
      description: Endpoint público, independente de MySQL, Keycloak e collector.
      responses:
        '200':
          description: Processo ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /liveness:
    get:
      tags:
        - Health
      summary: Verifica liveness do processo (compatibilidade)
      description: Endpoint público, independente de MySQL, Keycloak e collector.
      responses:
        '200':
          description: Processo ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /ready:
    get:
      tags:
        - Health
      summary: Verifica prontidão das dependências
      description: >-
        Endpoint público. Verifica MySQL e discovery Keycloak com prazo global de três segundos e capacidade limitada
        para probes em andamento. Não inclui detalhes de dependências na resposta.
      responses:
        '200':
          description: Dependências disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Uma ou mais dependências indisponíveis ou timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
  /metrics:
    get:
      tags:
        - Administration
      summary: Exporta métricas Prometheus
      description: >-
        Requer Bearer válido com papel admin. A agregação multiprocess combina workers da instância; labels usam
        templates de rota e o valor estável 404 para caminhos sem rota. OpenTelemetry é uma instrumentação separada.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métricas em texto no formato Prometheus
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tech:
    get:
      tags:
        - Administration
      summary: Relatório técnico
      description: Requer Bearer válido com papel admin.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Relatório HTML
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /articles/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
        - Articles
      summary: Detalha um artigo
      responses:
        '200':
          description: Artigo localizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Articles
      summary: Atualiza um artigo
      description: >-
        Requer Bearer válido com papel admin ou o autor vinculado ao artigo. Autor não pode enviar
        bypass_sanitization (nem mesmo false) e recebe 422; ao alterar post_entry, o servidor limpa eventual bypass e
        sanitiza o novo conteúdo. Alterações apenas de metadados preservam o bypass previamente autorizado por admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticlePatchInput'
      responses:
        '200':
          description: Artigo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Articles
      summary: Remove um artigo
      description: Requer Bearer válido com papel admin ou o autor vinculado ao artigo.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Artigo removido
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: integer
      description: Identificador do recurso
  responses:
    Unauthorized:
      description: Bearer ausente ou inválido
    Forbidden:
      description: Papel ou propriedade do recurso insuficiente
    NotFound:
      description: Recurso não encontrado
    Unprocessable:
      description: A entidade enviada é inválida
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    HealthUnavailable:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unavailable]
    Author:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        birthdate:
          type: string
          format: date
        photo_url:
          type: string
          format: uri
        public_key:
          type: string
        bio:
          type: string
          description: HTML sanitizado na leitura, exceto quando bypass_sanitization está ativo.
        bypass_sanitization:
          type: boolean
          description: Indica que o conteúdo bruto foi explicitamente autorizado por admin.
        socials:
          type: array
          items:
            $ref: '#/components/schemas/Social'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthorInput:
      type: object
      properties:
        author:
          type: object
          required:
            - name
            - birthdate
            - photo_url
            - public_key
            - bio
          properties:
            name:
              type: string
            birthdate:
              type: string
              format: date
            photo_url:
              type: string
              format: uri
            public_key:
              type: string
            bio:
              type: string
            bypass_sanitization:
              type: boolean
              description: Opcional e exclusivo de admin; true armazena e expõe a biografia como HTML bruto confiável.
    AuthorPatchInput:
      type: object
      properties:
        author:
          type: object
          minProperties: 1
          properties:
            name:
              type: string
            birthdate:
              type: string
              format: date
            photo_url:
              type: string
              format: uri
            public_key:
              type: string
            bio:
              type: string
            bypass_sanitization:
              type: boolean
              description: Opcional e exclusivo de admin; true armazena e expõe a biografia como HTML bruto confiável.
    Social:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        profile_link:
          type: string
          format: uri
        description:
          type: string
        author_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SocialInput:
      type: object
      properties:
        social:
          type: object
          required:
            - slug
            - profile_link
            - description
            - author_id
          properties:
            slug:
              type: string
            profile_link:
              type: string
              format: uri
            description:
              type: string
            author_id:
              type: integer
    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        published_label:
          type: string
        post_entry:
          type: string
          description: HTML sanitizado na leitura, exceto quando bypass_sanitization está ativo.
        bypass_sanitization:
          type: boolean
          description: Indica que o conteúdo bruto foi explicitamente autorizado por admin.
        tags:
          type: array
          items:
            type: string
        author_id:
          type: integer
        author:
          $ref: '#/components/schemas/Author'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ArticleInput:
      type: object
      properties:
        article:
          oneOf:
            - $ref: '#/components/schemas/AdminArticleInput'
            - $ref: '#/components/schemas/AuthorArticleInput'
    AdminArticleInput:
      type: object
      required: [title, slug, published_label, post_entry, author_id]
      properties:
        title:
          type: string
        slug:
          type: string
        published_label:
          type: string
        post_entry:
          type: string
        bypass_sanitization:
          type: boolean
          description: Opcional e exclusivo de admin; autores não podem enviar esta propriedade.
        tags:
          type: array
          items:
            type: string
        author_id:
          type: integer
    AuthorArticleInput:
      type: object
      required: [title, slug, published_label, post_entry]
      additionalProperties: false
      properties:
        title:
          type: string
        slug:
          type: string
        published_label:
          type: string
        post_entry:
          type: string
        tags:
          type: array
          items:
            type: string
    ArticlePatchInput:
      type: object
      properties:
        article:
          type: object
          minProperties: 1
          properties:
            title:
              type: string
            slug:
              type: string
            published_label:
              type: string
            post_entry:
              type: string
            tags:
              type: array
              items:
                type: string
            author_id:
              type: integer
            bypass_sanitization:
              type: boolean
              description: >-
                Opcional e exclusivo de admin. Autores não podem enviar esta propriedade. O valor true armazena e
                expõe HTML bruto confiável; omissão ou false aplica a allowlist.
    ArticlesCountByAuthor:
      type: object
      properties:
        author_id:
          type: integer
        author_name:
          type: string
        articles_count:
          type: integer
