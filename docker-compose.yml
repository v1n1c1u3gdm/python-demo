x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile
    target: api-app
  image: python-demo-api:local
  working_dir: /app/api
  environment: &api-environment
    FLASK_ENV: development
    DATABASE_URL: mysql+pymysql://ruby-demo:2u8y-c0d3@db:3306/ruby_demo_development
    VINICIUS_PUBLIC_KEY: "${VINICIUS_PUBLIC_KEY:-ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFakePublicKeyForViniciusSeedRecord}"
    LOG_DIR: /app/api/logs

services:
  api-init:
    <<: *api-common
    command: flask bootstrap-db
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-common
    command: ["/app/api/scripts/start-gunicorn.sh", "--config", "/app/api/gunicorn.conf.py", "-b", "0.0.0.0:3000", "-w", "4", "--threads", "4", "app:app"]
    environment:
      <<: *api-environment
      PROMETHEUS_MULTIPROC_DIR: /tmp/python-demo-prometheus-${COMPOSE_PROJECT_NAME:-python-demo}
      OTEL_METRICS_ENABLED: ${OTEL_METRICS_ENABLED:-false}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app/api
    depends_on:
      db:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui-app
    depends_on:
      - api
    ports:
      - "8080:80"

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ruby_demo_development
      MYSQL_USER: ruby-demo
      MYSQL_PASSWORD: 2u8y-c0d3
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin!123
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-python-demo.json:/opt/keycloak/data/import/realm-python-demo.json:ro
    depends_on:
      - db

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    profiles: [telemetry]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./api/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    mem_limit: 128m

volumes:
  mysql_data:
