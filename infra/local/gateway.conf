map $request_uri $safe_request_path {
    ~^([^?]*) $1;
}

log_format local_safe '$remote_addr - $remote_user [$time_local] "$request_method $safe_request_path $server_protocol" '
                      '$status $body_bytes_sent';

error_log /dev/stderr crit;

server {
    listen 443 ssl;
    server_name app.localhost;
    access_log /dev/stdout local_safe;

    ssl_certificate /run/local-secrets/tls/server.crt;
    ssl_certificate_key /run/local-secrets/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # /auth is available as soon as Keycloak starts; its init uses the internal URL.
    location = /auth { return 308 /auth/; }
    location ^~ /auth/ {
        set $identity_backend app-keycloak:8080;
        proxy_pass http://$identity_backend$request_uri;
    }

    location = /api { return 308 /api/; }
    location ^~ /api/ {
        set $api_backend app-api:3000;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$api_backend;
    }

    location = /share { return 404; }
    location ^~ /share/ { return 404; }

    # The watcher compares /ready/{bookstack,gitea,ci} with bootstrap-generation.
    # It creates one exact and one prefix location per route; each starts closed.
    include /tmp/local-routes/*.conf;

    location / {
        set $ui_backend app-ui:80;
        proxy_pass http://$ui_backend$request_uri;
    }
}

# Strict internal backchannel for BookStack. This is not published to the host;
# its separately issued SAN= gateway certificate leaves the public cert stable.
server {
    listen 8443 ssl;
    server_name gateway;
    access_log /dev/stdout local_safe;

    ssl_certificate /run/local-secrets/tls/backchannel.crt;
    ssl_certificate_key /run/local-secrets/tls/backchannel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    location = /auth { return 308 /auth/; }
    location ^~ /auth/ {
        proxy_set_header Host app.localhost;
        proxy_set_header X-Forwarded-Host app.localhost;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $identity_backend app-keycloak:8080;
        proxy_pass http://$identity_backend$request_uri;
    }
}
