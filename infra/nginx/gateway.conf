map $request_uri $api_upstream_path {
    ~^/api(?<api_suffix>/[^?]*) $api_suffix;
    default /;
}

map $request_uri $git_upstream_path {
    ~^/git(?<git_suffix>/[^?]*) $git_suffix;
    default /;
}

map $request_uri $bookstack_upstream_path {
    ~^/bookstack(?<bookstack_suffix>/[^?]*) $bookstack_suffix;
    default /;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /api {
        return 308 /api/$is_args$args;
    }

    location ^~ /api/ {
        set $api_backend app-api:3000;
        proxy_pass http://$api_backend$api_upstream_path$is_args$args;
    }

    location = /auth {
        return 308 /auth/$is_args$args;
    }

    location ^~ /auth/ {
        set $identity_backend app-keycloak:8080;
        proxy_pass http://$identity_backend$request_uri;
    }

    location = /git {
        return 308 /git/$is_args$args;
    }

    location ^~ /git/ {
        set $git_backend legacy-gitea:3000;
        proxy_pass http://$git_backend$git_upstream_path$is_args$args;
    }

    location = /bookstack {
        include /etc/nginx/routes/bookstack-root.conf;
    }

    location ^~ /bookstack/ {
        include /etc/nginx/routes/bookstack.conf;
    }

    location = /share {
        return 404;
    }

    location ^~ /share/ {
        return 404;
    }

    # Keep the existing manual, cron, and restart write restrictions at the edge.
    location ~ ^/ci/api/repos/[^/]+/(pipelines|cron)(/.*)?$ {
        if ($request_method !~ ^(GET|HEAD|DELETE)$) {
            return 403;
        }
        set $ci_backend ci-server:8000;
        proxy_pass http://$ci_backend$request_uri;
    }

    location = /ci {
        return 308 /ci/$is_args$args;
    }

    location /ci/ {
        set $ci_backend ci-server:8000;
        proxy_pass http://$ci_backend$request_uri;
    }

    location / {
        set $ui_backend app-ui:80;
        proxy_pass http://$ui_backend$request_uri;
    }
}
