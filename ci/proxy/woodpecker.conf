# Include this snippet inside the existing HTTPS server block.
# The upstream is loopback-only and the /ci path stays intact (no URI suffix).
location ~ ^/ci/api/repos/[^/]+/(pipelines(?:/[^/]+)?|cron(?:/[^/]+)?)/?$ {
    # Woodpecker v3.18.0 skips approval for manual/cron and restart paths.
    # Allow reads and deletion; deny creation, execution and restart writes.
    if ($request_method !~ ^(GET|HEAD|DELETE)$) {
        return 403;
    }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /ci/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
