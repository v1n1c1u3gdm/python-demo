name: ${COMPOSE_PROJECT_NAME:-python-demo-local}

services:
  local-init:
    image: python-demo-local-bootstrap:local
    build:
      context: .
      dockerfile: Dockerfile
      target: local-bootstrap
    entrypoint: ["python", "-m", "ci.local_bootstrap"]
    command: ["--secrets-dir", "/run/local-secrets", "--state-dir", "/run/local-state", "--public-host", "app.localhost"]
    environment:
      LOCAL_OWNER_UID: ${LOCAL_OWNER_UID:-1000}
      LOCAL_OWNER_GID: ${LOCAL_OWNER_GID:-1000}
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}
        target: /run/local-secrets
        bind:
          create_host_path: true
          selinux: z
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}
        target: /run/local-state
        bind:
          create_host_path: true
          selinux: z
    restart: "no"

  app-mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    command: ["--sql_generate_invisible_primary_key=OFF"]
    environment:
      MYSQL_DATABASE: python_demo
      MYSQL_USER: python_demo_api
      MYSQL_PASSWORD_FILE: /run/local-secrets/api_db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/local-secrets/mysql_root_password
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/mysql
        target: /run/local-secrets
        read_only: true
        bind:
          create_host_path: true
          selinux: z
      - app_mysql_data:/var/lib/mysql
      - app_mysql_socket:/var/run/mysqld
    networks: [app_data]
    depends_on:
      local-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent --host=127.0.0.1 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app-keycloak-db-init:
    image: python-demo-api:portable
    build:
      context: .
      dockerfile: Dockerfile
      target: api-app
    entrypoint: ["python", "/opt/python-demo/stack_config.py"]
    command: ["provision-keycloak-db"]
    environment:
      MYSQL_ADMIN_SOCKET: /var/run/mysqld/mysqld.sock
      MYSQL_ROOT_PASSWORD_FILE: /run/local-secrets/mysql_root_password
      KEYCLOAK_DB_PASSWORD_FILE: /run/local-secrets/keycloak_db_password
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/keycloak-db-init
        target: /run/local-secrets
        read_only: true
        bind:
          create_host_path: true
          selinux: z
      - app_mysql_socket:/var/run/mysqld
    networks: [app_data]
    depends_on:
      local-init:
        condition: service_completed_successfully
      app-mysql:
        condition: service_healthy
    restart: "no"

  app-init:
    image: python-demo-api:portable
    build:
      context: .
      dockerfile: Dockerfile
      target: api-app
    entrypoint: ["python", "/opt/python-demo/stack_config.py"]
    command: ["run-init"]
    environment: &api_runtime_environment
      API_DB_HOST: app-mysql
      API_DB_NAME: python_demo
      API_DB_USER: python_demo_api
      API_DB_PASSWORD_FILE: /run/local-secrets/api_db_password
      FLASK_ENV: production
      KEYCLOAK_BASE_URL: http://app-keycloak:8080/auth
      KEYCLOAK_ISSUER: https://app.localhost/auth/realms/python-demo
      KEYCLOAK_REALM: python-demo
      KEYCLOAK_CLIENT_ID: python-demo-api
      KEYCLOAK_CLIENT_SECRET_FILE: /run/local-secrets/keycloak_client_secret
      KEYCLOAK_AUDIENCE: python-demo-api
      KEYCLOAK_ADMIN_ROLE: admin
      KEYCLOAK_AUTHOR_ROLE: author
      LOG_DIR: /tmp/python-demo-logs
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/api
        target: /run/local-secrets
        read_only: true
        bind:
          create_host_path: true
          selinux: z
    networks: [app_data]
    depends_on:
      local-init:
        condition: service_completed_successfully
      app-mysql:
        condition: service_healthy
    restart: "no"

  app-keycloak:
    image: python-demo-keycloak:26.4.7
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
    command: ["start", "--hostname=https://app.localhost/auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://app-mysql:3306/keycloak?characterEncoding=UTF-8
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/local-secrets/keycloak_db_password
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://app.localhost/auth
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/local-secrets/keycloak_admin_password
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/keycloak
        target: /run/local-secrets
        read_only: true
        bind:
          create_host_path: true
          selinux: z
    networks:
      app_web:
        aliases: [app-keycloak]
      app_data: {}
    depends_on:
      local-init:
        condition: service_completed_successfully
      app-keycloak-db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  keycloak-init:
    image: python-demo-local-bootstrap:local
    build:
      context: .
      dockerfile: Dockerfile
      target: local-bootstrap
    entrypoint: ["python", "-m", "ci.local_keycloak"]
    command: ["--base-url", "http://app-keycloak:8080/auth", "--secrets-dir", "/run/local-secrets", "--state-dir", "/run/local-state"]
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/keycloak-init
        target: /run/local-secrets
        read_only: true
        bind:
          create_host_path: true
          selinux: z
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}
        target: /run/local-state
        bind:
          create_host_path: true
          selinux: z
    networks: [app_web]
    depends_on:
      local-init:
        condition: service_completed_successfully
      app-keycloak:
        condition: service_started
    restart: "no"

  bookstack-prepare:
    image: python-demo-local-bootstrap:local
    build:
      context: .
      dockerfile: Dockerfile
      target: local-bootstrap
    entrypoint: ["python", "-m", "ci.local_bookstack"]
    command: ["--state-dir", "/run/local-state", "--secrets-dir", "/run/local-secrets"]
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/bookstack
        target: /run/local-secrets
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}
        target: /run/local-state
        bind: {create_host_path: true, selinux: z}
    depends_on:
      local-init: {condition: service_completed_successfully}
      keycloak-init: {condition: service_completed_successfully}
    restart: "no"

  legacy-mariadb:
    image: docker.io/library/mariadb:11.4.13@sha256:f2f5e00999bd335343e09091e27e39c9386eb1822efcd0e0bac40b0003fa47e3
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD_FILE: /run/local-secrets/bookstack_db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/local-secrets/mariadb_root_password
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/mariadb
        target: /run/local-secrets
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - legacy_mariadb_data:/var/lib/mysql
    networks: [legacy_data]
    depends_on:
      local-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  legacy-bookstack:
    image: python-demo-local-bookstack:local
    build:
      context: .
      dockerfile: infra/local/bookstack.Dockerfile
    environment: &bookstack_environment
      APP_URL: https://app.localhost/bookstack
      AUTH_METHOD: oidc
      AUTH_AUTO_INITIATE: "false"
      OIDC_NAME: Keycloak
      OIDC_CLIENT_ID: bookstack
      FILE__OIDC_CLIENT_SECRET: /run/local-secrets/bookstack_client_secret
      OIDC_ISSUER: https://app.localhost/auth/realms/python-demo
      OIDC_ISSUER_DISCOVER: "false"
      OIDC_AUTH_ENDPOINT: https://app.localhost/auth/realms/python-demo/protocol/openid-connect/auth
      OIDC_TOKEN_ENDPOINT: https://gateway:8443/auth/realms/python-demo/protocol/openid-connect/token
      OIDC_USERINFO_ENDPOINT: https://gateway:8443/auth/realms/python-demo/protocol/openid-connect/userinfo
      OIDC_PUBLIC_KEY: file:///run/local-public/bookstack-id-token.pem
      OIDC_EXTERNAL_ID_CLAIM: sub
      OIDC_USER_TO_GROUPS: "true"
      OIDC_GROUPS_CLAIM: groups
      OIDC_ADDITIONAL_SCOPES: openid,profile,email
      OIDC_REMOVE_FROM_GROUPS: "true"
      FILE__APP_KEY: /run/local-secrets/bookstack_app_key
      DB_HOST: legacy-mariadb
      DB_PORT: 3306
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      FILE__DB_PASSWORD: /run/local-secrets/bookstack_db_password
      CURL_CA_BUNDLE: /run/local-secrets/tls/ca.crt
      SSL_CERT_FILE: /run/local-secrets/tls/ca.crt
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/bookstack
        target: /run/local-secrets
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}/public
        target: /run/local-public
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - legacy_bookstack_config:/config
    networks: [legacy_web, legacy_data]
    depends_on:
      legacy-mariadb: {condition: service_healthy}
      bookstack-prepare: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --cacert /run/local-secrets/tls/ca.crt http://127.0.0.1:80/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    restart: unless-stopped

  bookstack-init:
    image: python-demo-local-bookstack:local
    command: ["/usr/local/bin/bookstack-init.sh"]
    environment: *bookstack_environment
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/bookstack
        target: /run/local-secrets
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}
        target: /run/local-state
        bind: {create_host_path: true, selinux: z}
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}/public
        target: /run/local-public
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - legacy_bookstack_config:/config
    networks: [legacy_web, legacy_data]
    depends_on:
      legacy-bookstack: {condition: service_healthy}
      bookstack-prepare: {condition: service_completed_successfully}
    restart: "no"

  gitea-prepare:
    image: python-demo-local-bootstrap:local
    build:
      context: .
      dockerfile: Dockerfile
      target: local-bootstrap
    entrypoint: ["python", "-m", "ci.local_gitea"]
    command: ["--state-dir", "/run/local-state", "--secrets-dir", "/run/local-secrets"]
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/gitea
        target: /run/local-secrets
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}
        target: /run/local-state
        bind: {create_host_path: true, selinux: z}
    depends_on:
      local-init: {condition: service_completed_successfully}
      keycloak-init: {condition: service_completed_successfully}
    restart: "no"

  legacy-gitea:
    image: python-demo-local-gitea:local
    build:
      context: .
      dockerfile: infra/local/gitea.Dockerfile
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: https://app.localhost/git/
      GITEA__server__SERVE_FROM_SUB_PATH: "false"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM: "false"
      GITEA__service__ENABLE_BASIC_AUTHENTICATION: "false"
      GITEA__oauth2_client__ACCOUNT_LINKING: disabled
      GITEA__security__INSTALL_LOCK: "true"
      SSL_CERT_FILE: /run/local-secrets/tls/ca.crt
      GIT_SSL_CAINFO: /run/local-secrets/tls/ca.crt
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/gitea
        target: /run/local-secrets
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - legacy_gitea_data:/data
    networks: [legacy_web]
    depends_on:
      gitea-prepare: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  gitea-init:
    image: python-demo-local-gitea:local
    entrypoint: ["/bin/sh", "/usr/local/bin/gitea-init.sh"]
    environment:
      CURL_CA_BUNDLE: /run/local-secrets/tls/ca.crt
      SSL_CERT_FILE: /run/local-secrets/tls/ca.crt
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/gitea
        target: /run/local-secrets
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}
        target: /run/local-canonical
        bind: {create_host_path: true, selinux: z}
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/gitea-oauth-init
        target: /run/bootstrap-output
        bind: {create_host_path: true, selinux: z}
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}
        target: /run/local-state
        bind: {create_host_path: true, selinux: z}
      - legacy_gitea_data:/data
    networks: [legacy_web]
    depends_on:
      legacy-gitea: {condition: service_healthy}
      gitea-prepare: {condition: service_completed_successfully}
    restart: "no"

  gitea-oauth-init:
    image: python-demo-local-bootstrap:local
    entrypoint: ["python", "-m", "ci.local_woodpecker"]
    command: ["--state-dir", "/run/local-state", "--secrets-dir", "/run/local-secrets"]
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}
        target: /run/local-secrets
        bind: {create_host_path: true, selinux: z}
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}
        target: /run/local-state
        bind: {create_host_path: true, selinux: z}
    networks: [legacy_web]
    depends_on:
      gitea-init: {condition: service_completed_successfully}
      keycloak-init: {condition: service_completed_successfully}
      gateway: {condition: service_started}
    restart: "no"

  ci-server:
    image: python-demo-local-woodpecker:local
    build:
      context: .
      dockerfile: infra/local/woodpecker.Dockerfile
    environment:
      WOODPECKER_HOST: https://app.localhost/ci
      WOODPECKER_OPEN: "false"
      WOODPECKER_ADMIN: admin
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: https://app.localhost/git
      WOODPECKER_DEFAULT_APPROVAL_MODE: all_events
      WOODPECKER_AUTHENTICATE_PUBLIC_REPOS: "false"
      WOODPECKER_PLUGINS_PRIVILEGED: ""
      WOODPECKER_PLUGINS_TRUSTED_CLONE: ""
      WOODPECKER_DEFAULT_CLONE_PLUGIN: docker.io/woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
      WOODPECKER_HOSTNAME: python-demo-local-ci
      WOODPECKER_SERVER_ADDR: :8000
      WOODPECKER_DATABASE_DRIVER: sqlite3
      WOODPECKER_DATABASE_DATASOURCE: /var/lib/woodpecker/woodpecker.sqlite
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/woodpecker
        target: /run/local-secrets
        read_only: true
        bind: {create_host_path: true, selinux: z}
      - woodpecker_data:/var/lib/woodpecker
    networks: [ci_web, ci_control]
    depends_on:
      local-init: {condition: service_completed_successfully}
      gitea-oauth-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  ci-init:
    image: python-demo-local-bootstrap:local
    entrypoint: ["python", "-m", "ci.local_woodpecker", "--publish-ready"]
    command: ["--state-dir", "/run/local-state"]
    volumes:
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}
        target: /run/local-state
        bind: {create_host_path: true, selinux: z}
    networks: [ci_web]
    depends_on:
      ci-server: {condition: service_healthy}
      gitea-oauth-init: {condition: service_completed_successfully}
    restart: "no"

  legacy-share:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    profiles: [share]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - type: bind
        source: ./infra/share/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {create_host_path: false, selinux: z}
      - type: bind
        source: ./infra/share
        target: /usr/share/nginx/html
        read_only: true
        bind: {create_host_path: false, selinux: z}
    networks: [legacy_web]
    restart: unless-stopped

  app-api:
    image: python-demo-api:portable
    build:
      context: .
      dockerfile: Dockerfile
      target: api-app
    entrypoint: ["python", "/opt/python-demo/stack_config.py"]
    command: ["run-api"]
    environment:
      <<: *api_runtime_environment
      PROMETHEUS_MULTIPROC_DIR: /tmp/python-demo-prometheus-local
      OTEL_METRICS_ENABLED: "false"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      REQUESTS_CA_BUNDLE: /run/local-secrets/tls/ca.crt
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/api
        target: /run/local-secrets
        read_only: true
        bind:
          create_host_path: true
          selinux: z
    networks:
      app_web:
        aliases: [app-api]
      app_data: {}
    depends_on:
      local-init:
        condition: service_completed_successfully
      app-mysql:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  app-ui:
    image: python-demo-ui:portable
    build:
      context: .
      dockerfile: Dockerfile
      target: ui-app
      args:
        VITE_API_BASE_URL: /api
        VITE_ARTICLES_URL: /api/articles
        VITE_AUTHORS_URL: /api/authors
        VITE_ARTICLES_COUNT_URL: /api/articles/count_by_author
        VITE_SOCIALS_URL: /api/socials
        VITE_ARTICLE_PUBLIC_BASE_URL: https://app.localhost
        VITE_SSO_ENABLED: "true"
        VITE_KEYCLOAK_URL: https://app.localhost/auth
        VITE_KEYCLOAK_REALM: python-demo
        VITE_KEYCLOAK_CLIENT_ID: python-demo-ui
    networks:
      app_web:
        aliases: [app-ui]
    depends_on:
      app-api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: python-demo-local-gateway:local
    build:
      context: .
      dockerfile: infra/local/gateway.Dockerfile
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - type: bind
        source: ${LOCAL_SECRETS_DIR:-./infra/secrets/local}/runtime/gateway
        target: /run/local-secrets
        read_only: true
        bind:
          create_host_path: true
          selinux: z
      - type: bind
        source: ${LOCAL_STATE_DIR:-./infra/.local}
        target: /run/local-state
        read_only: true
        bind:
          create_host_path: true
          selinux: z
    tmpfs:
      - /tmp/local-routes
    networks:
      app_web:
        aliases: [app.localhost]
      legacy_web:
        aliases: [app.localhost]
      ci_web:
        aliases: [app.localhost]
    depends_on:
      local-init:
        condition: service_completed_successfully
      app-keycloak:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - type: bind
        source: ./api/observability/otel-collector.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
        bind:
          create_host_path: false
    networks: [app_web]

networks:
  app_web:
    name: ${COMPOSE_PROJECT_NAME:-python-demo-local}_app_web
    driver: bridge
  app_data:
    name: ${COMPOSE_PROJECT_NAME:-python-demo-local}_app_data
    driver: bridge
    internal: true
  legacy_web:
